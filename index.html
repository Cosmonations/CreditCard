<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Card UI</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <header>Payment Details</header>
        <form action="success.html">

            <div class="input-field">
                <label>Card Number</label>
                <i class="bx bx-credit-card card-icon"></i>
                <input type="text" placeholder="1234 5678 8901 1234" class="card-number" maxlength="19" />
                <span class="error">
                    <i class="bx bx-error-circle error-icon"></i>
                    <p class="error-text">Enter a valid 16-digit card number</p>
                </span>
            </div>

            <div class="row">
                <div class="input-field">
                    <label>Expiry Date</label>
                    <input type="text" placeholder="MM / YY" class="expiry" maxlength="7" />
                    <span class="error">
                        <i class="bx bx-error-circle error-icon"></i>
                        <p class="error-text">Use MM/YY format</p>
                    </span>
                </div>

                <div class="input-field">
                    <label>CVV</label>
                    <input type="text" placeholder="123" class="cvv" maxlength="4" />
                    <span class="error">
                        <i class="bx bx-error-circle error-icon"></i>
                        <p class="error-text">Enter a 3-digit CVV</p>
                    </span>
                </div>
            </div>

            <div class="input-field">
                <label>Cardholder Name</label>
                <input type="text" placeholder="John Doe" class="card-name" />
                <span class="error">
                    <i class="bx bx-error-circle error-icon"></i>
                    <p class="error-text">Please enter the cardholder name</p>
                </span>
            </div>

            <div class="input-field button">
                <input type="submit" value="Pay Now" />
            </div>
        </form>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>

</html>
